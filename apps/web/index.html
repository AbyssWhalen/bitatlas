<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111713" />
    <meta name="description" content="BitAtlas - local-first computer science study and visualization workspace" />
    <link rel="icon" href="/favicon.svg" />
    <title>BitAtlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const redirect = sessionStorage.getItem('bitatlas-redirect');
        if (!redirect) return;
        sessionStorage.removeItem('bitatlas-redirect');
        window.history.replaceState(null, '', redirect);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
